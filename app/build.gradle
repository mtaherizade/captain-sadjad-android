plugins {
    id 'com.android.application'
}

// Optional release signing. The CI workflow generates release.keystore +
// keystore.properties; without them, `assembleRelease` produces an unsigned APK
// and `assembleDebug` still produces a fully installable one.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.captainsadjad.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.captainsadjad.game'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    if (hasReleaseKeystore) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
